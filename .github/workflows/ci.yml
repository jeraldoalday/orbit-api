name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    env:
      DATABASE_URL: postgresql+psycopg2://u:p@localhost:5432/db
      JWT_SECRET_KEY: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: black --check .

      - name: Run unit tests
        run: >
          pytest -m "not integration" --cov=app
          --junitxml=test-results/unit-junit.xml

      - name: Run integration tests
        run: pytest -m integration --junitxml=test-results/integration-junit.xml

      - name: Publish unit test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit test results
          path: test-results/unit-junit.xml
          reporter: java-junit

      - name: Publish integration test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Integration test results
          path: test-results/integration-junit.xml
          reporter: java-junit

      - name: Upload JUnit XML artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-reports
          path: test-results/*.xml
          retention-days: 14
